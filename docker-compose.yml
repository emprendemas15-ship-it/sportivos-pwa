services:
  postgres:
    image: postgres:16-alpine
    container_name: sportivos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportivos
      POSTGRES_USER: sportivos
      POSTGRES_PASSWORD: sportivos_dev
    ports:
      - "5432:5432"
    volumes:
      - sportivos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportivos -d sportivos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sportivos-postgres-data:
